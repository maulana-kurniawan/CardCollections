name: Build & Release Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm CardCollections.spec

      - name: Verify Compiled Binary
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CardCollections.exe")) {
            Write-Error "CardCollections.exe was not created!"
            exit 1
          }
          $size = (Get-Item "dist\CardCollections.exe").Length
          Write-Host "CardCollections.exe successfully generated! Size: $size bytes"

      - name: Package Portable Distribution
        shell: pwsh
        run: |
          # Create a clean release directory structure
          New-Item -ItemType Directory -Path "release-dist" -Force | Out-Null
          Copy-Item -Path "dist\CardCollections.exe" -Destination "release-dist\"
          Copy-Item -Path "data.json" -Destination "release-dist\"
          Copy-Item -Path "images" -Destination "release-dist\images" -Recurse
          Copy-Item -Path "README.md" -Destination "release-dist\"

          # Compress to portable zip
          Compress-Archive -Path "release-dist\*" -DestinationPath "CardCollections-Windows-Portable.zip" -Force
          Write-Host "CardCollections-Windows-Portable.zip created successfully."

      - name: Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CardCollections-Windows-Build
          path: |
            CardCollections-Windows-Portable.zip
            dist/CardCollections.exe
          retention-days: 30

      - name: Determine Release Tag and Title
        id: release_info
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
            $title = "Card Collections $tag"
            $isPrerelease = "false"
          } else {
            $tag = "build-$shortSha"
            $title = "Card Collections Build #$env:GITHUB_RUN_NUMBER ($shortSha)"
            $isPrerelease = "false"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🎴 Card Collections (Animal Kaiser Edition)
            
            Otomatis dikompilasi oleh GitHub Actions dari commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).
            
            ### 📦 Berkas Unduhan:
            - **`CardCollections-Windows-Portable.zip`** *(Sangat Direkomendasikan)*: Paket lengkap portabel berisi `CardCollections.exe`, database `data.json`, dan folder aset `images/`. Tinggal unduh, ekstrak, dan jalankan!
            - **`CardCollections.exe`**: File binary mandiri (*standalone executable*).
            
            ---
            *Compiled on Windows Server with PyInstaller & Python 3.11*
          files: |
            CardCollections-Windows-Portable.zip
            dist/CardCollections.exe
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
