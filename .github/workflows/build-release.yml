name: Build & Release Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm CardCollections.spec

      - name: Verify Compiled Binary
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CardCollections.exe")) {
            Write-Error "CardCollections.exe was not created!"
            exit 1
          }
          $size = (Get-Item "dist\CardCollections.exe").Length
          Write-Host "CardCollections.exe successfully generated! Size: $size bytes"

      - name: Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CardCollections-Windows
          path: dist/CardCollections.exe
          retention-days: 30

      - name: Determine Release Tag and Title
        id: release_info
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "build-$shortSha"
          $title = "Card Collections Build #$env:GITHUB_RUN_NUMBER ($shortSha)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🎴 Card Collections (Animal Kaiser Edition)
            
            Automatically compiled by GitHub Actions from push commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).
            
            ### 📦 Download Assets:
            - **`CardCollections.exe`**: Standalone Windows executable.
            
            > **Note:** The `data.json` database and `images/` folder are not bundled as they are auto-generated when you add cards through the application.
            
            ---
            *Author: [maulana-kurniawan](https://github.com/maulana-kurniawan) | Vibe coded with Antigravity (Gemini 3.8 Flash) ⚡ | Based on original project by [Bebeq](https://github.com/Bebeq/Card-Collections)*
          files: |
            dist/CardCollections.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
